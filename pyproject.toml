[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "data-integrity-compiler"
version = "0.1.0"
description = "Reproducible detection and impact analysis for silent pipeline corruption"
license = {text = "Apache-2.0"}
requires-python = ">=3.10,<3.14"
dependencies = ["duckdb==1.2.2", "PyYAML==6.0.2", "jsonschema==4.23.0", "psutil==7.1.0"]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[project.scripts]
dic = "dic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
